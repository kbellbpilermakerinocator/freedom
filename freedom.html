<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Month of Freedom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600&display=swap">
<style>
:root{
  --sky-top:#140a04; --sky-mid:#6e2a08; --sun:#ff7a1a; --orange:#ff6a00;
  --ink:#fff3e6; --dim:#e8b48a;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--sky-top);color:var(--ink);font-family:var(--body);overflow-x:hidden}
.sky{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  padding-block:1.5rem 2.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 35%,var(--sky-mid) 0,var(--sky-top) 70%);text-align:center}

/* Screeching eagle: real photo in a glowing frame */
.eagle{position:relative;width:min(340px,74vw);aspect-ratio:1}
.eagle .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  box-shadow:0 0 0 4px var(--orange),0 0 50px rgba(255,106,0,.55);animation:breathe 4s ease-in-out infinite}
.eagle img{width:100%;height:100%;object-fit:cover;object-position:45% 50%;display:block;
  filter:sepia(.25) saturate(1.1) contrast(1.05)}
.eagle svg{position:absolute;left:-17%;top:24%;width:26%;overflow:visible;pointer-events:none}
.wave{fill:none;stroke:var(--orange);stroke-width:7;stroke-linecap:round;opacity:0}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
.eagle.screech .ph{animation:lunge 2.7s ease-out 1}
.eagle.screech .wave{animation:wave 1.2s ease-out 2}
.eagle.screech .wave:nth-of-type(2){animation-delay:.15s}
.eagle.screech .wave:nth-of-type(3){animation-delay:.3s}
@keyframes lunge{0%{transform:none}8%{transform:translateX(-10px) rotate(-4deg) scale(1.06)}
  14%,26%,38%,50%{transform:translateX(-12px) rotate(-5deg) scale(1.07)}
  20%,32%,44%,56%{transform:translateX(-8px) rotate(-3deg) scale(1.06)}
  70%{transform:translateX(-6px) rotate(-2deg) scale(1.04)}100%{transform:none}}
@keyframes wave{0%{opacity:0;transform:translateX(10px) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translateX(-24px) scale(1.25)}}
.credit{font-size:.75rem;color:var(--dim);opacity:.7;margin-top:1rem}
.credit a{color:inherit}

h1{font-family:var(--display);font-size:clamp(3rem,13vw,8.5rem);line-height:.9;margin:0;letter-spacing:.02em;text-wrap:balance;
  color:var(--ink);text-shadow:0 4px 0 var(--orange),0 0 40px rgba(255,106,0,.5)}
.clock{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.6rem,3vw,2rem)}
.unit{display:flex;flex-direction:column;align-items:center;min-width:4.5rem}
.num{font-family:var(--display);font-size:clamp(2.6rem,10vw,6rem);font-variant-numeric:tabular-nums;line-height:1;color:var(--orange)}
.lbl{font-size:.9rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.until{font-size:1.15rem;color:var(--dim)}
.done .num{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.eagle .ph,.eagle.screech .ph,.eagle.screech .wave{animation:none}}
</style>
</head>
<body>
<div class="sky">
  <div class="eagle" id="eagle">
    <div class="ph"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Wedge-tailed_Eagle_portrait.jpg/960px-Wedge-tailed_Eagle_portrait.jpg" alt="Wedge-tailed eagle"></div>
    <svg viewBox="0 0 120 160" aria-hidden="true">
      <path class="wave" d="M100,50 q-18,30 0,60"/>
      <path class="wave" d="M78,34 q-28,46 0,92"/>
      <path class="wave" d="M56,18 q-38,62 0,124"/>
    </svg>
  </div>

  <h1>Month of Freedom</h1>
  <div class="clock" id="clock">
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">Mins</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">Secs</span></div>
  </div>
  <div class="until" id="until">Freedom starts tonight at 7:00 pm Perth time</div>
  <div class="credit">Eagle photo: <a href="https://commons.wikimedia.org/wiki/File:Wedge-tailed_Eagle_portrait.jpg">James Niland</a>, <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a> (cropped, tinted)</div>
</div>
<script>
// Raptor screech, rendered once into a real WAV clip and played through an <audio>
// element. That plays on iPhones (even with the silent switch on) and Android alike.
function voice(ctx,dest){
  // Sound-alike of the classic Hollywood "freedom" screech (really a red-tailed hawk):
  // a hoarse, scratchy kee-eeeeee-arrrr that holds high, then falls away, with a big echo.
  const dur=2.7;
  // cinematic echo
  const dry=ctx.createGain(); dry.gain.value=1; dry.connect(dest);
  const dl=ctx.createDelay(1); dl.delayTime.value=0.21;
  const fb=ctx.createGain(); fb.gain.value=0.38;
  const wet=ctx.createGain(); wet.gain.value=0.45;
  const damp=ctx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=4500;
  dry.connect(dl); dl.connect(damp); damp.connect(fb); fb.connect(dl); damp.connect(wet); wet.connect(dest);

  const env=ctx.createGain();
  env.gain.setValueAtTime(0.0001,0);
  env.gain.exponentialRampToValueAtTime(1,0.05);
  env.gain.setValueAtTime(1,1.1);
  env.gain.linearRampToValueAtTime(0.7,2.0);
  env.gain.exponentialRampToValueAtTime(0.0001,dur);
  env.connect(dry);
  // pitch path: a scratchy "k" kick, snap up high, hold, then a long sagging fall
  const glide=(param,mul)=>{
    param.setValueAtTime(3000*mul,0);
    param.exponentialRampToValueAtTime(4600*mul,0.08);
    param.exponentialRampToValueAtTime(4200*mul,0.5);
    param.exponentialRampToValueAtTime(3500*mul,1.1);
    param.exponentialRampToValueAtTime(2300*mul,1.9);
    param.exponentialRampToValueAtTime(1400*mul,dur);
  };
  // hoarse rasp: fast, slightly uneven amplitude flutter
  const rasp=ctx.createGain(); rasp.gain.value=0.5;
  [[83,0.32],[131,0.18]].forEach(([f,g])=>{
    const l=ctx.createOscillator(), d=ctx.createGain(); l.type='square';
    l.frequency.setValueAtTime(f,0); l.frequency.linearRampToValueAtTime(f*0.7,dur);
    d.gain.value=g; l.connect(d); d.connect(rasp.gain); l.start(0); l.stop(dur);
  });
  rasp.connect(env);
  // scratchy breath: noise through two tracking bands (the main body of the cry)
  const n=Math.ceil(ctx.sampleRate*dur), nb=ctx.createBuffer(1,n,ctx.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<n;i++) nd[i]=Math.random()*2-1;
  [[1,7,1.1],[0.5,5,0.45]].forEach(([mul,q,g])=>{
    const ns=ctx.createBufferSource(); ns.buffer=nb;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=q; glide(f.frequency,mul);
    const gg=ctx.createGain(); gg.gain.value=g;
    ns.connect(f); f.connect(gg); gg.connect(rasp); ns.start(0);
  });
  // thin tonal whistle underneath so it still reads as a voice
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=5; glide(bp.frequency,1);
  const tg=ctx.createGain(); tg.gain.value=0.35; bp.connect(tg); tg.connect(rasp);
  [-30,0,28].forEach(det=>{
    const o=ctx.createOscillator(); o.type='sawtooth'; o.detune.value=det; glide(o.frequency,1);
    const vib=ctx.createOscillator(), vd=ctx.createGain(); vib.frequency.value=37; vd.gain.value=120;
    vib.connect(vd); vd.connect(o.frequency);
    o.connect(bp); o.start(0); vib.start(0); o.stop(dur); vib.stop(dur);
  });
}
function toWav(buf){
  const d=buf.getChannelData(0), n=d.length, sr=buf.sampleRate;
  let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(d[i]));
  const g=peak?0.95/peak:1;
  const ab=new ArrayBuffer(44+n*2), v=new DataView(ab);
  const w=(o,str)=>{for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,d[i]*g)); v.setInt16(44+i*2,x*32767,true)}
  return URL.createObjectURL(new Blob([ab],{type:'audio/wav'}));
}
const cry=new Audio(); cry.preload='auto';
(async()=>{
  try{
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext, sr=44100;
    const oc=new OAC(1,Math.round(sr*3.6),sr);
    voice(oc,oc.destination);
    const buf=await new Promise((res,rej)=>{const r=oc.startRendering(); if(r&&r.then) r.then(res,rej); else oc.oncomplete=e=>res(e.renderedBuffer)});
    cry.src=toWav(buf); cry.load();
  }catch(e){}
})();
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}

// One screech, 2 seconds after the page opens. Most phones block sound until the page
// has been touched, so if it's blocked, it fires on the first tap instead.
let done=false, armed=false;
function once(){
  if(done) return;
  try{
    cry.currentTime=0;
    const p=cry.play();
    if(p&&p.then) p.then(()=>{done=true;shake()},()=>{armed=true});
    else {done=true;shake();}
  }catch(e){ armed=true; }
}
function shake(){const e=document.getElementById('eagle');e.classList.remove('screech');void e.offsetWidth;e.classList.add('screech');}
function waitReady(fn){ cry.src ? fn() : setTimeout(()=>waitReady(fn),100); }
setTimeout(()=>waitReady(once),2000);
['click','touchend','keydown'].forEach(e=>addEventListener(e,()=>{ if(armed&&!done){ armed=false; once(); } }));

const end=new Date('2026-11-09T19:00:00+08:00').getTime();
const p=n=>String(n).padStart(2,'0');
function tick(){
  let t=Math.max(0,end-Date.now());
  const d=Math.floor(t/864e5);t%=864e5;
  const h=Math.floor(t/36e5);t%=36e5;
  const m=Math.floor(t/6e4),s=Math.floor(t%6e4/1e3);
  document.getElementById('d').textContent=d;
  document.getElementById('h').textContent=p(h);
  document.getElementById('m').textContent=p(m);
  document.getElementById('s').textContent=p(s);
  if(end<=Date.now()){document.getElementById('clock').classList.add('done');document.getElementById('until').textContent='Freedom is here.'}
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
