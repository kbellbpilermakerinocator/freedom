<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Month of Freedom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600&display=swap">
<style>
:root{
  --sky-top:#140a04; --sky-mid:#6e2a08; --sun:#ff7a1a; --orange:#ff6a00;
  --ink:#fff3e6; --dim:#e8b48a;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--sky-top);color:var(--ink);font-family:var(--body);overflow-x:hidden}
.sky{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  padding-block:1.5rem 2.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 35%,var(--sky-mid) 0,var(--sky-top) 70%);text-align:center}
#art{display:none}
#bird{animation:bob 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flag{animation:drift 7s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
h1{font-family:var(--display);font-size:clamp(3rem,13vw,8.5rem);line-height:.9;margin:0;letter-spacing:.02em;text-wrap:balance;
  color:var(--ink);text-shadow:0 4px 0 var(--orange),0 0 40px rgba(255,106,0,.5)}
.clock{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.6rem,3vw,2rem)}
.unit{display:flex;flex-direction:column;align-items:center;min-width:4.5rem}
.num{font-family:var(--display);font-size:clamp(2.6rem,10vw,6rem);font-variant-numeric:tabular-nums;line-height:1;color:var(--orange)}
.lbl{font-size:.9rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.until{font-size:1.15rem;color:var(--dim)}
.done .num{color:var(--ink)}
@media (prefers-reduced-motion:reduce){#bird,.flag{animation:none}}
</style>
</head>
<body>
<div class="sky">
<svg id="art" viewBox="0 0 700 520" role="img" aria-label="Wedge-tailed eagle swooping with talons out through an Australian flag swoosh">
  <defs>
    <radialGradient id="sunG"><stop offset="0" stop-color="#ffb35c"/><stop offset=".45" stop-color="#ff6a00" stop-opacity=".75"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
    <radialGradient id="bodyG" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#7a4a22"/><stop offset=".45" stop-color="#3a200e"/><stop offset="1" stop-color="#1c0e05"/></radialGradient>
    <linearGradient id="flightG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1508"/><stop offset=".6" stop-color="#4a2a14"/><stop offset="1" stop-color="#160a03"/></linearGradient>
    <linearGradient id="trouserG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c3418"/><stop offset="1" stop-color="#a06a34"/></linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="rim"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff8a2a" flood-opacity=".8"/></filter>
  </defs>
  <circle cx="350" cy="250" r="250" fill="url(#sunG)"/>
  <g class="flag">
    <g filter="url(#soft)" opacity=".9">
      <path fill="#c8102e" d="M-60,110 C150,40 300,190 450,120 C560,70 650,100 760,80 L760,165 C650,185 560,155 450,205 C300,275 150,130 -60,195 Z"/>
      <path fill="#f4efe8" d="M-60,195 C150,130 300,275 450,205 C560,155 650,185 760,165 L760,225 C650,245 560,220 450,265 C300,335 150,200 -60,255 Z"/>
      <path fill="#012169" d="M-60,255 C150,200 300,335 450,265 C560,220 650,245 760,225 L760,330 C650,350 560,320 450,370 C300,430 150,310 -60,360 Z"/>
    </g>
    <g id="stars" fill="#fff"></g>
  </g>
  <g id="bird" filter="url(#rim)">
    <g id="tail"></g>
    <g transform="translate(322,205) scale(-0.95,0.95)"><g>
      <animateTransform attributeName="transform" type="rotate" values="-16 0 0;10 0 0;-16 0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="2.6s" repeatCount="indefinite"/>
      <g class="wing"></g></g></g>
    <g transform="translate(378,205) scale(0.95)"><g>
      <animateTransform attributeName="transform" type="rotate" values="-16 0 0;10 0 0;-16 0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="2.6s" repeatCount="indefinite"/>
      <g class="wing"></g></g></g>
    <g id="legs"></g>
    <path fill="url(#bodyG)" d="M306,196 C282,240 290,312 325,342 L375,342 C410,312 418,240 394,196 Z"/>
    <g transform="translate(456,40) scale(-0.4,0.4)">
      <path fill="#2a160a" d="M150,148 C175,105 230,85 285,100 C330,112 350,160 345,210 C342,270 365,330 390,400 L150,400 C160,340 175,290 160,240 C155,225 150,215 148,205 Z"/>
      <path fill="#c47a2c" d="M232,90 C292,88 340,128 346,200 C334,176 306,158 268,152 C258,130 248,108 232,90 Z"/>
      <path fill="#8a4f1c" d="M262,150 C300,158 330,180 345,212 C346,240 352,262 360,290 C340,250 310,215 268,190 Z"/>
      <g fill="none" stroke="#e0a050" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M260,110 q30,8 48,30"/><path d="M278,128 q28,10 44,34"/><path d="M250,98 q30,4 52,20"/></g>
      <path fill="#e8d9b8" d="M148,150 C110,150 80,175 65,210 C62,222 66,232 74,236 C76,226 82,220 92,218 C110,214 130,210 152,206 Z"/>
      <path fill="#1a0d05" d="M65,210 C62,222 66,232 74,236 C76,226 80,221 87,219 C79,214 71,212 65,210 Z"/>
      <path fill="none" stroke="#6b4a2a" stroke-width="2" d="M92,218 C115,212 135,209 156,207"/>
      <path fill="#f2c94c" d="M140,148 C155,140 170,148 172,165 C170,185 168,200 160,214 L148,206 C152,190 152,165 140,148 Z"/>
      <circle cx="212" cy="166" r="13" fill="#c9871f"/><circle cx="210" cy="166" r="7" fill="#0d0603"/><circle cx="207" cy="162" r="2.5" fill="#fff3e6"/>
      <path fill="#1a0d05" d="M172,152 C198,136 232,136 254,152 C232,150 205,154 184,166 Z"/>
    </g>
    <g id="chest"></g>
  </g>
</svg>
  <h1>Month of Freedom</h1>
  <div class="clock" id="clock">
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">Mins</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">Secs</span></div>
  </div>
  <div class="until" id="until">Freedom starts tonight at 7:00 pm Perth time</div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e};
function feather(g,bx,by,deg,len,w,fill,edge){
  const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  const tx=bx+c*len,ty=by+s*len,mx=bx+c*len*.5,my=by+s*len*.5,px=-s*w,py=c*w;
  el('path',{d:`M${bx},${by} Q${mx+px},${my+py} ${tx},${ty} Q${mx-px},${my-py} ${bx},${by}Z`,fill,stroke:edge,'stroke-width':1.4},g);
  el('path',{d:`M${bx},${by} L${bx+c*len*.85},${by+s*len*.85}`,stroke:'#0e0602','stroke-width':1,opacity:.6},g);
}
const shade=i=>['#2a1609','#33190a','#3e2412','#2e170a'][i%4];
document.querySelectorAll('.wing').forEach(g=>{
  for(let i=0;i<10;i++){const t=i/9;feather(g,8+t*150,-6-t*80,80-t*38,112+t*10,22,'url(#flightG)','#7a4a24')}
  for(let i=0;i<7;i++){const t=i/6;feather(g,150+t*18,-82-t*10,10-t*52,150-t*22,15,'url(#flightG)','#8a5a2e')}
  el('path',{d:'M-6,10 C30,-30 90,-72 168,-98 C180,-92 180,-76 168,-66 C112,-40 62,-8 12,26 Z',fill:'#1e0f05'},g);
  for(let i=0;i<9;i++){const t=i/8;feather(g,6+t*150,-4-t*78,72-t*30,62,22,shade(i),'#9a6634')}
  for(let i=0;i<8;i++){const t=i/7;feather(g,4+t*140,-10-t*74,60-t*24,36,16,shade(i+1),'#b07a3e')}
});
const tail=document.getElementById('tail');
for(let i=0;i<9;i++){const off=Math.abs(i-4);feather(tail,350,318,66+i*6,150-off*14,18,'url(#flightG)','#7a4a24')}
const legs=document.getElementById('legs');
[[332,-1],[368,1]].forEach(([x,dir])=>{
  el('path',{d:`M${x-16},300 C${x-22},335 ${x-16},368 ${x-6},380 L${x+10},380 C${x+18},360 ${x+18},330 ${x+12},300 Z`,fill:'url(#trouserG)',stroke:'#2a1609','stroke-width':1.5},legs);
  for(let k=0;k<4;k++){const a=(70+k*(18*dir))*Math.PI/180;const bx=x+2,by=380;const ex=bx+Math.cos(a)*(22-k*2)+(k-1.5)*7,ey=by+18+(k%2)*4;
    el('path',{d:`M${bx},${by} L${ex},${ey}`,stroke:'#f2c94c','stroke-width':6,'stroke-linecap':'round'},legs);
    el('path',{d:`M${ex-2},${ey} q4,10 -4,14`,stroke:'#0d0603','stroke-width':3.5,fill:'none','stroke-linecap':'round'},legs);}
});
const chest=document.getElementById('chest');
for(let r=0;r<5;r++)for(let c=0;c<4-(r>2?1:0);c++){const x=322+c*18+(r%2)*9-(r>2?-9:0),y=208+r*24;
  el('path',{d:`M${x-10},${y} q10,16 20,0`,fill:'none',stroke:'#8a5a2e','stroke-width':2,opacity:.55},chest);}
function star(cx,cy,r,n,g){let d='';for(let i=0;i<n*2;i++){const rr=i%2?r*.45:r,a=Math.PI*i/n-Math.PI/2;d+=(i?'L':'M')+(cx+Math.cos(a)*rr)+','+(cy+Math.sin(a)*rr)}el('path',{d:d+'Z'},g)}
const sg=document.getElementById('stars');
star(120,318,15,7,sg);star(560,300,10,7,sg);star(600,276,9,7,sg);star(640,296,10,7,sg);star(602,328,11,7,sg);star(622,310,5,5,sg);

const end=new Date('2026-11-09T19:00:00+08:00').getTime();
const p=n=>String(n).padStart(2,'0');
function tick(){
  let t=Math.max(0,end-Date.now());
  const d=Math.floor(t/864e5);t%=864e5;
  const h=Math.floor(t/36e5);t%=36e5;
  const m=Math.floor(t/6e4),s=Math.floor(t%6e4/1e3);
  document.getElementById('d').textContent=d;
  document.getElementById('h').textContent=p(h);
  document.getElementById('m').textContent=p(m);
  document.getElementById('s').textContent=p(s);
  if(end<=Date.now()){document.getElementById('clock').classList.add('done');document.getElementById('until').textContent='Freedom is here.'}
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
