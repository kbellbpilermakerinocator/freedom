<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Month of Freedom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600&display=swap">
<style>
:root{
  --sky-top:#140a04; --sky-mid:#6e2a08; --sun:#ff7a1a; --orange:#ff6a00;
  --ink:#fff3e6; --dim:#e8b48a;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--sky-top);color:var(--ink);font-family:var(--body);overflow-x:hidden}
.sky{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  padding-block:1.5rem 2.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 35%,var(--sky-mid) 0,var(--sky-top) 70%);text-align:center}

/* Screeching eagle */
.eagle{position:relative;width:min(440px,90vw);cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0;color:inherit}
.eagle svg{width:100%;height:auto;display:block;overflow:visible}
#head{transform-box:view-box;transform-origin:120px 290px;animation:lunge 2.4s ease-in-out infinite}
#jaw{transform-box:view-box;transform-origin:292px 168px;animation:jaw 2.4s ease-in-out infinite}
.wave{fill:none;stroke:var(--orange);stroke-width:7;stroke-linecap:round;opacity:0;transform-box:view-box;transform-origin:360px 170px;animation:wave 2.4s ease-out infinite}
.wave:nth-of-type(2){animation-delay:.15s}
.wave:nth-of-type(3){animation-delay:.3s}
.skree{font-family:var(--display);fill:var(--ink);paint-order:stroke;stroke:var(--orange);stroke-width:6px;letter-spacing:2px;
  transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-out infinite}
@keyframes lunge{0%,15%,100%{transform:rotate(0)}30%,60%{transform:rotate(-4deg) translateX(6px)}35%,45%,55%{transform:rotate(-3deg) translateX(4px)}40%,50%{transform:rotate(-5deg) translateX(7px)}}
@keyframes jaw{0%,15%,80%,100%{transform:rotate(-14deg)}30%,62%{transform:rotate(14deg)}}
@keyframes wave{0%,25%{opacity:0;transform:scale(.6)}35%{opacity:1}70%,100%{opacity:0;transform:scale(1.5)}}
@keyframes pop{0%,25%{opacity:0;transform:scale(.4) rotate(-6deg)}35%{opacity:1;transform:scale(1.1) rotate(-6deg)}62%{opacity:1;transform:scale(1) rotate(-4deg)}75%,100%{opacity:0;transform:scale(1) rotate(-4deg)}}
.eagle.go #head,.eagle.go #jaw,.eagle.go .wave,.eagle.go .skree{animation-duration:1.2s;animation-iteration-count:1}
.hint{font-size:.95rem;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin-top:-.4rem}

h1{font-family:var(--display);font-size:clamp(3rem,13vw,8.5rem);line-height:.9;margin:0;letter-spacing:.02em;text-wrap:balance;
  color:var(--ink);text-shadow:0 4px 0 var(--orange),0 0 40px rgba(255,106,0,.5)}
.clock{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.6rem,3vw,2rem)}
.unit{display:flex;flex-direction:column;align-items:center;min-width:4.5rem}
.num{font-family:var(--display);font-size:clamp(2.6rem,10vw,6rem);font-variant-numeric:tabular-nums;line-height:1;color:var(--orange)}
.lbl{font-size:.9rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.until{font-size:1.15rem;color:var(--dim)}
.done .num{color:var(--ink)}
@media (prefers-reduced-motion:reduce){#head,#jaw,.wave,.skree{animation:none}.skree{opacity:1}#jaw{transform:rotate(14deg)}}
</style>
</head>
<body>
<div class="sky">
  <button class="eagle" id="eagle" type="button" aria-label="Wedge-tailed eagle screeching. Tap to hear the freedom screech">
    <svg viewBox="0 0 480 320" aria-hidden="true">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffb35c"/><stop offset=".5" stop-color="#ff6a00" stop-opacity=".55"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
        <linearGradient id="plume" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a2a12"/><stop offset=".6" stop-color="#2a1608"/><stop offset="1" stop-color="#140904"/></linearGradient>
        <linearGradient id="nape" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a4f1c"/><stop offset=".55" stop-color="#d89038"/><stop offset="1" stop-color="#f0b860"/></linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e6c8"/><stop offset=".7" stop-color="#cdbb94"/><stop offset="1" stop-color="#3a2a1a"/></linearGradient>
        <filter id="rim"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff8a2a" flood-opacity=".7"/></filter>
      </defs>
      <circle cx="190" cy="170" r="170" fill="url(#glow)"/>

      <!-- sound waves -->
      <path class="wave" d="M372,128 q22,42 0,84"/>
      <path class="wave" d="M396,108 q34,62 0,124"/>
      <path class="wave" d="M420,88 q46,82 0,164"/>

      <g id="head" filter="url(#rim)">
        <!-- neck and head mass with bristling hackles -->
        <path fill="url(#plume)" d="M40,320 C34,262 50,206 86,164 L72,150 L98,148 L90,128 L114,134 L114,110 L136,122 L144,98 L160,114 L176,92 L186,110 C214,88 256,86 282,104 C296,114 304,128 306,146 L296,170 C292,196 280,214 262,226 C250,262 246,292 250,320 Z"/>
        <!-- golden nape -->
        <path fill="url(#nape)" d="M118,128 L136,122 L144,98 L160,114 L176,92 L186,110 C214,92 248,90 270,104 C244,104 218,114 196,132 C178,146 166,166 160,188 C148,168 134,148 118,128 Z"/>
        <g fill="none" stroke="#f6c870" stroke-width="2.5" stroke-linecap="round" opacity=".75">
          <path d="M170,118 q24,-8 44,-6"/><path d="M160,136 q26,-12 50,-10"/><path d="M156,156 q20,-14 40,-16"/>
        </g>
        <!-- chest feather scallops -->
        <g fill="none" stroke="#6a3e1c" stroke-width="2.5" opacity=".7">
          <path d="M120,250 q12,14 24,0"/><path d="M150,262 q12,14 24,0"/><path d="M180,250 q12,14 24,0"/>
          <path d="M106,280 q12,14 24,0"/><path d="M136,292 q12,14 24,0"/><path d="M166,282 q12,14 24,0"/><path d="M196,272 q12,14 24,0"/>
        </g>

        <!-- open mouth interior -->
        <path fill="#5a0e0e" d="M292,150 C316,150 340,156 360,166 L356,186 C334,196 310,196 292,186 Z"/>
        <path fill="#c43a3a" d="M300,170 C318,170 334,174 346,180 C334,188 314,188 302,182 Z"/>

        <!-- lower mandible, hinged so it drops open -->
        <g id="jaw">
          <path fill="url(#beak)" d="M290,166 C314,172 338,180 356,182 C356,192 346,200 330,200 C310,200 294,192 286,180 Z"/>
          <path fill="none" stroke="#7a6446" stroke-width="2" d="M292,172 C312,178 332,184 350,186"/>
        </g>

        <!-- upper mandible with hooked tip -->
        <path fill="url(#beak)" d="M282,124 C312,114 346,120 366,142 C376,154 376,172 362,182 C364,170 358,160 346,156 C328,150 306,150 288,156 Z"/>
        <path fill="#1c120a" d="M362,182 C374,172 376,154 366,142 C372,156 372,170 362,182 Z"/>
        <path fill="none" stroke="#9a8460" stroke-width="2" d="M292,150 C312,146 334,148 350,156"/>
        <!-- cere and nostril -->
        <path fill="#e8d6a0" d="M278,120 C290,116 302,118 308,126 C300,136 292,148 286,160 C280,148 278,134 278,120 Z"/>
        <ellipse cx="296" cy="130" rx="5" ry="3" fill="#2a1a0c" transform="rotate(-20 296 130)"/>

        <!-- fierce eye with heavy brow -->
        <circle cx="252" cy="134" r="13" fill="#d9921f"/>
        <circle cx="255" cy="134" r="7" fill="#0d0603"/>
        <circle cx="258" cy="130" r="2.6" fill="#fff3e6"/>
        <path fill="#140904" d="M222,124 C238,108 266,108 286,120 C268,118 252,120 238,132 C232,128 226,126 222,124 Z"/>
        <path fill="none" stroke="#140904" stroke-width="3" d="M240,148 q12,4 24,-2"/>
      </g>

      <text class="skree" x="372" y="64" font-size="46" text-anchor="middle">SKREEE!</text>
    </svg>
  </button>
  <div class="hint">Tap the eagle</div>

  <h1>Month of Freedom</h1>
  <div class="clock" id="clock">
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">Mins</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">Secs</span></div>
  </div>
  <div class="until" id="until">Freedom starts tonight at 7:00 pm Perth time</div>
</div>
<script>
// Synthesised raptor screech: a falling, warbling cry with a raspy edge. No audio file needed.
let ctx;
function screech(){
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    const t=ctx.currentTime, dur=1.3;
    const out=ctx.createGain();
    out.gain.setValueAtTime(0.0001,t);
    out.gain.exponentialRampToValueAtTime(0.5,t+0.04);
    out.gain.setValueAtTime(0.5,t+0.6);
    out.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=4;
    bp.frequency.setValueAtTime(2600,t); bp.frequency.exponentialRampToValueAtTime(1500,t+dur);
    bp.connect(out); out.connect(ctx.destination);
    // two detuned voices for rasp
    [0,18].forEach(det=>{
      const o=ctx.createOscillator(); o.type='sawtooth'; o.detune.value=det;
      o.frequency.setValueAtTime(2400,t);
      o.frequency.exponentialRampToValueAtTime(2900,t+0.08);
      o.frequency.exponentialRampToValueAtTime(1300,t+dur);
      const lfo=ctx.createOscillator(), depth=ctx.createGain();
      lfo.frequency.value=28; depth.gain.value=140;
      lfo.connect(depth); depth.connect(o.frequency);
      o.connect(bp); o.start(t); lfo.start(t); o.stop(t+dur); lfo.stop(t+dur);
    });
  }catch(e){}
}
const eagle=document.getElementById('eagle');
eagle.addEventListener('click',()=>{
  screech();
  eagle.classList.remove('go'); void eagle.offsetWidth; eagle.classList.add('go');
  clearTimeout(eagle._t); eagle._t=setTimeout(()=>eagle.classList.remove('go'),1300);
});

const end=new Date('2026-11-09T19:00:00+08:00').getTime();
const p=n=>String(n).padStart(2,'0');
function tick(){
  let t=Math.max(0,end-Date.now());
  const d=Math.floor(t/864e5);t%=864e5;
  const h=Math.floor(t/36e5);t%=36e5;
  const m=Math.floor(t/6e4),s=Math.floor(t%6e4/1e3);
  document.getElementById('d').textContent=d;
  document.getElementById('h').textContent=p(h);
  document.getElementById('m').textContent=p(m);
  document.getElementById('s').textContent=p(s);
  if(end<=Date.now()){document.getElementById('clock').classList.add('done');document.getElementById('until').textContent='Freedom is here.'}
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
