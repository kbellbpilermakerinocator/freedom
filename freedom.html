<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Month of Freedom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600&display=swap">
<style>
:root{
  --sky-top:#140a04; --sky-mid:#6e2a08; --sun:#ff7a1a; --orange:#ff6a00;
  --ink:#fff3e6; --dim:#e8b48a;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--sky-top);color:var(--ink);font-family:var(--body);overflow-x:hidden}
.sky{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  padding-block:1.5rem 2.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 35%,var(--sky-mid) 0,var(--sky-top) 70%);text-align:center}

/* Screeching eagle */
.eagle{position:relative;width:min(440px,90vw)}
.eagle svg{width:100%;height:auto;display:block;overflow:visible}
#head{transform-box:view-box;transform-origin:120px 290px;animation:lunge 2.4s ease-in-out infinite}
#jaw{transform-box:view-box;transform-origin:314px 164px;animation:jaw 2.4s ease-in-out infinite}
.wave{fill:none;stroke:var(--orange);stroke-width:7;stroke-linecap:round;opacity:0;transform-box:view-box;transform-origin:384px 170px;animation:wave 2.4s ease-out infinite}
.wave:nth-of-type(2){animation-delay:.15s}
.wave:nth-of-type(3){animation-delay:.3s}
@keyframes lunge{0%,15%,100%{transform:rotate(0)}30%,60%{transform:rotate(-4deg) translateX(6px)}35%,45%,55%{transform:rotate(-3deg) translateX(4px)}40%,50%{transform:rotate(-5deg) translateX(7px)}}
@keyframes jaw{0%,15%,80%,100%{transform:rotate(-4deg)}30%,62%{transform:rotate(16deg)}}
@keyframes wave{0%,25%{opacity:0;transform:scale(.6)}35%{opacity:1}70%,100%{opacity:0;transform:scale(1.5)}}

h1{font-family:var(--display);font-size:clamp(3rem,13vw,8.5rem);line-height:.9;margin:0;letter-spacing:.02em;text-wrap:balance;
  color:var(--ink);text-shadow:0 4px 0 var(--orange),0 0 40px rgba(255,106,0,.5)}
.clock{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.6rem,3vw,2rem)}
.unit{display:flex;flex-direction:column;align-items:center;min-width:4.5rem}
.num{font-family:var(--display);font-size:clamp(2.6rem,10vw,6rem);font-variant-numeric:tabular-nums;line-height:1;color:var(--orange)}
.lbl{font-size:.9rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.until{font-size:1.15rem;color:var(--dim)}
.done .num{color:var(--ink)}
@media (prefers-reduced-motion:reduce){#head,#jaw,.wave{animation:none}#jaw{transform:rotate(14deg)}}
</style>
</head>
<body>
<div class="sky">
  <div class="eagle" id="eagle" role="img" aria-label="Wedge-tailed eagle screeching">
    <svg viewBox="0 0 480 320" aria-hidden="true">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffb35c"/><stop offset=".5" stop-color="#ff6a00" stop-opacity=".5"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
        <linearGradient id="neckG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c5226"/><stop offset=".5" stop-color="#6a3416"/><stop offset="1" stop-color="#3a1c0a"/></linearGradient>
        <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1e0c"/><stop offset="1" stop-color="#1a0d05"/></linearGradient>
        <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1ece2"/><stop offset=".55" stop-color="#c9c6c2"/><stop offset=".85" stop-color="#7c8189"/><stop offset="1" stop-color="#3a3e44"/></linearGradient>
        <radialGradient id="irisG" cx=".4" cy=".4"><stop offset="0" stop-color="#d9a24a"/><stop offset=".7" stop-color="#9a6a22"/><stop offset="1" stop-color="#4a3010"/></radialGradient>
        <filter id="rim"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff8a2a" flood-opacity=".6"/></filter>
      </defs>
      <circle cx="200" cy="170" r="170" fill="url(#glow)"/>

      <!-- sound waves -->
      <path class="wave" d="M394,132 q22,42 0,84"/>
      <path class="wave" d="M418,112 q34,62 0,124"/>
      <path class="wave" d="M442,92 q46,82 0,164"/>

      <g id="head" filter="url(#rim)">
        <!-- dark shoulders -->
        <path fill="url(#bodyG)" d="M0,320 C14,268 52,236 104,222 L262,222 C292,240 312,276 318,320 Z"/>
        <g id="scallops"></g>
        <!-- neck and head mass -->
        <path fill="url(#neckG)" d="M86,246 C74,200 96,146 146,110 C186,82 246,72 292,90 C316,100 330,118 332,138 L326,162 C316,194 292,220 260,238 C200,256 130,262 86,246 Z"/>
        <g id="hackles"></g>
        <!-- darker crown -->
        <path fill="#2a1408" opacity=".85" d="M178,96 C214,78 262,74 296,90 C312,98 322,108 326,120 C300,104 262,96 226,102 C206,106 190,104 178,96 Z"/>
        <!-- pale cheek and gape skin -->
        <path fill="#c9b9a0" d="M276,148 C292,142 310,146 322,156 C310,166 294,168 280,160 Z"/>
        <!-- mouth interior -->
        <path fill="#b9606a" d="M318,150 C340,148 358,152 372,160 L368,178 C348,186 330,182 316,170 Z"/>
        <path fill="#e39aa2" d="M324,162 C340,162 354,166 362,172 C350,178 334,176 324,170 Z"/>
        <!-- lower mandible -->
        <g id="jaw">
          <path fill="#d6d0c6" d="M314,160 C336,166 356,174 372,178 C370,186 360,192 344,190 C328,188 316,180 310,170 Z"/>
          <path fill="none" stroke="#9a948a" stroke-width="1.5" d="M318,166 C336,172 352,178 366,181"/>
        </g>
        <!-- cere -->
        <path fill="#efe6d2" d="M300,108 C316,100 334,104 342,114 C334,128 326,142 318,154 C306,140 300,124 300,108 Z"/>
        <ellipse cx="322" cy="118" rx="5" ry="3" fill="#2a1e14" transform="rotate(-18 322 118)"/>
        <!-- upper mandible with deep hook -->
        <path fill="url(#beakG)" d="M330,108 C356,102 382,112 394,136 C402,154 398,174 384,182 C386,168 380,158 368,154 C352,150 334,150 318,154 C324,138 328,122 330,108 Z"/>
        <path fill="#2e3238" d="M384,182 C398,174 402,154 394,136 C398,154 396,170 384,182 Z"/>
        <path fill="none" stroke="#8a8a8a" stroke-width="1.5" d="M322,150 C342,146 362,148 376,156"/>
        <!-- eye: amber-brown under a heavy brow -->
        <circle cx="282" cy="122" r="11" fill="url(#irisG)"/>
        <circle cx="284" cy="122" r="5" fill="#0d0603"/>
        <circle cx="287" cy="118" r="2.2" fill="#fff6e8"/>
        <path fill="none" stroke="#4a3020" stroke-width="2" d="M270,124 C276,134 290,135 296,126"/>
        <path fill="#140904" d="M256,112 C270,98 298,96 316,108 C298,106 284,108 270,120 C264,116 260,114 256,112 Z"/>
      </g>
    </svg>
  </div>

  <h1>Month of Freedom</h1>
  <div class="clock" id="clock">
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">Mins</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">Secs</span></div>
  </div>
  <div class="until" id="until">Freedom starts tonight at 7:00 pm Perth time</div>
</div>
<script>
// Shaggy hackles and scalloped shoulder feathers, drawn once with a fixed seed.
(function(){
  const NS='http://www.w3.org/2000/svg';
  let seed=7; const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
  const spike=(g,x,y,ang,len,w,fill)=>{
    const c=Math.cos(ang),s=Math.sin(ang),tx=x+c*len,ty=y+s*len,px=-s*w,py=c*w;
    el('path',{d:`M${x+px},${y+py} Q${x+c*len*.55+px*.4},${y+s*len*.55+py*.4} ${tx},${ty} Q${x+c*len*.55-px*.4},${y+s*len*.55-py*.4} ${x-px},${y-py}Z`,fill},g);
  };
  const hk=document.getElementById('hackles');
  const cols=['#5a2c10','#7a3c18','#9c5226','#b8662e','#c97a3a','#6a3414'];
  // back of the neck, from the shoulders up over the crown: spikes flare back and up
  for(let i=0;i<70;i++){
    const t=i/69, u=1-t;
    const x=u*u*90+2*u*t*84+t*t*196, y=u*u*246+2*u*t*130+t*t*88;
    const ang=Math.PI*(1.05+0.25*t)+ (r()-.5)*0.5;
    spike(hk,x+(r()-.5)*10,y+(r()-.5)*10,ang,22+r()*26,4+r()*3,cols[(r()*cols.length)|0]);
  }
  // loose strands over the neck surface
  const soft=['#7a3c18','#8a4620','#6a3416','#a0582a'];
  for(let i=0;i<120;i++){
    const x=105+r()*170, y=110+r()*135;
    if(x+y*0.6>370 || (x>250&&y<150)) continue;
    spike(hk,x,y,Math.PI*(0.72+r()*0.12),18+r()*20,1.6+r()*1.4,soft[(r()*soft.length)|0]);
  }
  // throat feathers hanging down at the front
  for(let i=0;i<22;i++){
    const t=i/21, x=240+t*70-(r()*8), y=236-t*70+(r()*8);
    spike(hk,x,y,Math.PI*(0.35+r()*0.2),16+r()*14,4,cols[(r()*3)|0]);
  }
  // scalloped shoulder feathers with tan tips
  const sc=document.getElementById('scallops');
  for(let y=236;y<330;y+=13){
    const xmin=Math.max(8,104-(y-222)*0.95), xmax=Math.min(312,262+(y-222)*0.55);
    for(let x=xmin+((y/13)%2)*9;x<xmax;x+=18){
      const jx=x+(r()-.5)*4, jy=y+(r()-.5)*3;
      el('path',{d:`M${jx-9},${jy-6} Q${jx},${jy+12} ${jx+9},${jy-6} Z`,fill:r()>.5?'#2a1408':'#331a0a'},sc);
      el('path',{d:`M${jx-8},${jy-2} Q${jx},${jy+10} ${jx+8},${jy-2}`,fill:'none',stroke:r()>.4?'#7a5028':'#9a6a3a','stroke-width':1.8,opacity:.6},sc);
    }
  }
})();
</script>
<script>
// Raptor screech, rendered once into a real WAV clip and played through an <audio>
// element. That plays on iPhones (even with the silent switch on) and Android alike.
function voice(ctx,dest){
  // Sound-alike of the classic Hollywood "freedom" screech (really a red-tailed hawk):
  // a hoarse, scratchy kee-eeeeee-arrrr that holds high, then falls away, with a big echo.
  const dur=2.7;
  // cinematic echo
  const dry=ctx.createGain(); dry.gain.value=1; dry.connect(dest);
  const dl=ctx.createDelay(1); dl.delayTime.value=0.21;
  const fb=ctx.createGain(); fb.gain.value=0.38;
  const wet=ctx.createGain(); wet.gain.value=0.45;
  const damp=ctx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=4500;
  dry.connect(dl); dl.connect(damp); damp.connect(fb); fb.connect(dl); damp.connect(wet); wet.connect(dest);

  const env=ctx.createGain();
  env.gain.setValueAtTime(0.0001,0);
  env.gain.exponentialRampToValueAtTime(1,0.05);
  env.gain.setValueAtTime(1,1.1);
  env.gain.linearRampToValueAtTime(0.7,2.0);
  env.gain.exponentialRampToValueAtTime(0.0001,dur);
  env.connect(dry);
  // pitch path: a scratchy "k" kick, snap up high, hold, then a long sagging fall
  const glide=(param,mul)=>{
    param.setValueAtTime(3000*mul,0);
    param.exponentialRampToValueAtTime(4600*mul,0.08);
    param.exponentialRampToValueAtTime(4200*mul,0.5);
    param.exponentialRampToValueAtTime(3500*mul,1.1);
    param.exponentialRampToValueAtTime(2300*mul,1.9);
    param.exponentialRampToValueAtTime(1400*mul,dur);
  };
  // hoarse rasp: fast, slightly uneven amplitude flutter
  const rasp=ctx.createGain(); rasp.gain.value=0.5;
  [[83,0.32],[131,0.18]].forEach(([f,g])=>{
    const l=ctx.createOscillator(), d=ctx.createGain(); l.type='square';
    l.frequency.setValueAtTime(f,0); l.frequency.linearRampToValueAtTime(f*0.7,dur);
    d.gain.value=g; l.connect(d); d.connect(rasp.gain); l.start(0); l.stop(dur);
  });
  rasp.connect(env);
  // scratchy breath: noise through two tracking bands (the main body of the cry)
  const n=Math.ceil(ctx.sampleRate*dur), nb=ctx.createBuffer(1,n,ctx.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<n;i++) nd[i]=Math.random()*2-1;
  [[1,7,1.1],[0.5,5,0.45]].forEach(([mul,q,g])=>{
    const ns=ctx.createBufferSource(); ns.buffer=nb;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=q; glide(f.frequency,mul);
    const gg=ctx.createGain(); gg.gain.value=g;
    ns.connect(f); f.connect(gg); gg.connect(rasp); ns.start(0);
  });
  // thin tonal whistle underneath so it still reads as a voice
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=5; glide(bp.frequency,1);
  const tg=ctx.createGain(); tg.gain.value=0.35; bp.connect(tg); tg.connect(rasp);
  [-30,0,28].forEach(det=>{
    const o=ctx.createOscillator(); o.type='sawtooth'; o.detune.value=det; glide(o.frequency,1);
    const vib=ctx.createOscillator(), vd=ctx.createGain(); vib.frequency.value=37; vd.gain.value=120;
    vib.connect(vd); vd.connect(o.frequency);
    o.connect(bp); o.start(0); vib.start(0); o.stop(dur); vib.stop(dur);
  });
}
function toWav(buf){
  const d=buf.getChannelData(0), n=d.length, sr=buf.sampleRate;
  let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(d[i]));
  const g=peak?0.95/peak:1;
  const ab=new ArrayBuffer(44+n*2), v=new DataView(ab);
  const w=(o,str)=>{for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,d[i]*g)); v.setInt16(44+i*2,x*32767,true)}
  return URL.createObjectURL(new Blob([ab],{type:'audio/wav'}));
}
const cry=new Audio(); cry.preload='auto';
(async()=>{
  try{
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext, sr=44100;
    const oc=new OAC(1,Math.round(sr*3.6),sr);
    voice(oc,oc.destination);
    const buf=await new Promise((res,rej)=>{const r=oc.startRendering(); if(r&&r.then) r.then(res,rej); else oc.oncomplete=e=>res(e.renderedBuffer)});
    cry.src=toWav(buf); cry.load();
  }catch(e){}
})();
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}

// One screech, 2 seconds after the page opens. Most phones block sound until the page
// has been touched, so if it's blocked, it fires on the first tap instead.
let done=false, armed=false;
function once(){
  if(done) return;
  try{
    cry.currentTime=0;
    const p=cry.play();
    if(p&&p.then) p.then(()=>{done=true},()=>{armed=true});
    else done=true;
  }catch(e){ armed=true; }
}
function waitReady(fn){ cry.src ? fn() : setTimeout(()=>waitReady(fn),100); }
setTimeout(()=>waitReady(once),2000);
['click','touchend','keydown'].forEach(e=>addEventListener(e,()=>{ if(armed&&!done){ armed=false; once(); } }));

const end=new Date('2026-11-09T19:00:00+08:00').getTime();
const p=n=>String(n).padStart(2,'0');
function tick(){
  let t=Math.max(0,end-Date.now());
  const d=Math.floor(t/864e5);t%=864e5;
  const h=Math.floor(t/36e5);t%=36e5;
  const m=Math.floor(t/6e4),s=Math.floor(t%6e4/1e3);
  document.getElementById('d').textContent=d;
  document.getElementById('h').textContent=p(h);
  document.getElementById('m').textContent=p(m);
  document.getElementById('s').textContent=p(s);
  if(end<=Date.now()){document.getElementById('clock').classList.add('done');document.getElementById('until').textContent='Freedom is here.'}
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
